<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wire Tech Repairs</title>
    <link rel="stylesheet" href="SiteStyle/global.css"><!--Estilo de la pagina-->
</head>


<body><!--Contenido de la pagina-->

    <header>

        <!--Banner, logo y nombre-->
        <div id="encabezado">
            <div id="banner">
                <img src="SiteImage/bannert2.jpg" alt="banner">
            </div>

            <div id="logo">
                <img src="SiteImage/logo.png" alt="logo">
            </div>

            <h1>Wire Tech Repairs</h1>
        </div>

        <nav><!--Barra de navegacion-->
            <a href="index.html">Home</a>
            <a href="quotes.html">Quotes</a>
            <a href="repair.html">Get a Repair</a>
        </nav>

    </header>

    <main>
        <form action="form.php" method="post">
            <h2>Get a Repair</h2>

            <h4>1. What happend?</h4>
            <textarea name="txtwhath" id="txtwhath"></textarea>
            <h4>2. Type of device:</h4>
            <select name="tdevice" id="tdevice">
                <option value="phone">Phone</option>
                <option value="console">Console</option>
                <option value="laptop">Laptop</option>
                <option value="desktop">Desktop</option>
                <option value="other">Other</option>
            </select>
            <h4>3. Contact Info:</h4>
            <input type="email" name="email" class="textinputs" placeholder="Email" required>
            <input type="number" name="phonenumber" class="textinputs" placeholder="Phone Number" required>
            <h4>4. Address:</h4>
            <input type="text" name="address" class="textinputs" placeholder="Address" required>
            <input type="text" name="country" class="textinputs" placeholder="Country"  required>
            <br>
            <input type="text" name="zip" class="textinputs" placeholder="Zip Code" required>
            <input type="text" name="city" class="textinputs" placeholder="City" required>
            <h4>5. Send the device to us at:<br></h4>

            <input type="submit" name="submit" value="submit" id="buttons">
        </form>
    </main>

    <footer>
        <p>Have a problem?</p>
        <div class="contactbutton">
        <a href="contact.html">Contact Us</a>
        </div>
    </footer>
    
</body>

</html>
